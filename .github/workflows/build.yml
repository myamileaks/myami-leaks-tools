name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MyamiLeaksTools/MyamiLeaksTools.csproj

      - name: Publish single-file EXE
        run: |
          dotnet publish MyamiLeaksTools/MyamiLeaksTools.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.sha }}
          name: "Myami Leaks Tools — build ${{ steps.sha.outputs.sha }}"
          body: |
            ## Myami Leaks Tools
            **GTA V / FiveM Pack Editor Suite**

            ### Download
            ↓ `MyamiLeaksTools.exe` below — no install required, run directly.

            ### Tools included
            Sky Editor · Timecycle Editor · Blood FX · RPF Editor · Tracer Editor
            Particles Editor · SoundPack Editor · Stables Editor · Ramps Editor
            Gen D10 Packs · Snow Packs · Animation Sky · Particles Custom
            RPF Protection · Performance · Tokkyo AI Assistant

            ### Requirements
            Windows 10/11 x64

            > discord.gg/myami
          files: publish/MyamiLeaksTools.exe
          draft: false
          prerelease: false
